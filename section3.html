<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Section 3 – Innovation & Uniqueness</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:      #ff4d8d;
      --pink-dark: #c9306a;
      --bg:        #0d0d1f;
      --surface:   #12122a;
      --border:    #26264a;
      --text:      #e0e0ff;
      --muted:     #7777aa;
      --bar-h:     72px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    /* ── top bar ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 1.2rem;
      background: rgba(13,13,31,0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .back-link {
      color: var(--pink);
      text-decoration: none;
      font-size: 0.85rem;
    }
    .back-link:hover { text-decoration: underline; }
    .section-badge {
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .section-name {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--pink);
      max-width: 240px;
      text-align: center;
    }

    /* ── slide scroll area ── */
    .slides-area {
      padding: 1.2rem 1rem calc(var(--bar-h) + 1.5rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      max-width: 900px;
      margin: 0 auto;
    }
    .slide-frame {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      border: 1.5px solid var(--border);
      box-shadow: 0 4px 28px rgba(0,0,0,0.55);
    }
    .slide-frame img {
      width: 100%;
      display: block;
    }

    /* ── floating audio bar ── */
    .audio-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--bar-h);
      background: rgba(16,16,36,0.97);
      backdrop-filter: blur(12px);
      border-top: 1.5px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 1.2rem;
      z-index: 100;
    }

    /* progress row */
    .prog-row {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      margin-bottom: 0.4rem;
    }
    .time-txt {
      font-size: 0.72rem;
      color: var(--muted);
      min-width: 78px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    /* progress track */
    .prog-track {
      flex: 1;
      position: relative;
      height: 18px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .prog-bg {
      position: absolute;
      inset: 0;
      margin: auto;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
    }
    .prog-fill {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 3px;
      background: var(--pink);
      border-radius: 2px;
      width: 0%;
      pointer-events: none;
    }
    .prog-thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      transform: translate(-50%, -50%);
      width: 11px;
      height: 11px;
      background: var(--pink);
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(255,77,141,0.7);
      pointer-events: none;
    }
    .prog-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      margin: 0;
    }

    /* controls row */
    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }
    /* play/pause */
    .btn-play {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--pink);
      color: #fff;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 2px 10px rgba(255,77,141,0.45);
    }
    .btn-play:hover { background: var(--pink-dark); transform: scale(1.08); }

    /* replay */
    .btn-icon {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      transition: color 0.15s;
    }
    .btn-icon:hover { color: var(--pink); }

    /* section label inside bar */
    .bar-label {
      flex: 1;
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 0.4rem;
    }
    .bar-label span { color: var(--pink); font-weight: 600; }

    /* volume */
    .vol-group {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
    }
    .vol-slider {
      width: 64px;
      accent-color: var(--pink);
      cursor: pointer;
    }

    /* status */
    .status-txt {
      font-size: 0.68rem;
      color: var(--muted);
      text-align: right;
      min-width: 80px;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<!-- sticky top bar -->
<div class="topbar">
  <a class="back-link" href="index.html">&larr; All sections</a>
  <p class="section-name">Innovation & Uniqueness</p>
  <span class="section-badge">Section 3&nbsp;/ 7</span>
</div>

<!-- scrollable slides -->
<div class="slides-area">
<div class="slide-frame"><img src="slide_p6.png" alt="Slide page 7" loading="lazy"/></div>
</div>

<!-- hidden audio element -->
<audio id="audio" preload="auto">
  <source src="3.ogg" type="audio/ogg">
</audio>

<!-- floating audio bar -->
<div class="audio-bar">

  <!-- progress row -->
  <div class="prog-row">
    <span class="time-txt" id="timeTxt">0:00 / --:--</span>
    <div class="prog-track" id="progTrack">
      <div class="prog-bg"></div>
      <div class="prog-fill"  id="progFill"></div>
      <div class="prog-thumb" id="progThumb"></div>
      <input class="prog-input" type="range" id="progInput"
             min="0" max="100" step="0.05" value="0"
             oninput="onSeek(this.value)">
    </div>
  </div>

  <!-- controls row -->
  <div class="ctrl-row">
    <button class="btn-play" id="btnPlay" title="Play / Pause" onclick="togglePlay()">&#9654;</button>
    <button class="btn-icon" title="Replay" onclick="replay()">&#8635;</button>
    <p class="bar-label">Narration &mdash; <span>Innovation & Uniqueness</span></p>
    <div class="vol-group">
      <button class="btn-icon" id="btnVol" title="Mute / Unmute" onclick="toggleMute()">&#128266;</button>
      <input class="vol-slider" type="range" id="volSlider"
             min="0" max="1" step="0.05" value="1"
             oninput="setVol(this.value)">
    </div>
    <span class="status-txt" id="statusTxt">Loading&hellip;</span>
  </div>

</div>

<script>
  const audio    = document.getElementById('audio');
  const btnPlay  = document.getElementById('btnPlay');
  const progFill = document.getElementById('progFill');
  const progThumb= document.getElementById('progThumb');
  const progInput= document.getElementById('progInput');
  const timeTxt  = document.getElementById('timeTxt');
  const statusTxt= document.getElementById('statusTxt');
  const volSlider= document.getElementById('volSlider');
  const btnVol   = document.getElementById('btnVol');

  function fmt(s) {
    if (!isFinite(s)) return '--:--';
    const m = Math.floor(s / 60);
    return m + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  }

  function syncProgress() {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    progFill.style.width  = pct + '%';
    progThumb.style.left  = pct + '%';
    progInput.value       = pct;
    timeTxt.textContent   = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
  }

  function togglePlay() {
    audio.paused ? audio.play() : audio.pause();
  }

  function replay() {
    audio.currentTime = 0;
    audio.play();
  }

  function onSeek(val) {
    if (audio.duration) audio.currentTime = (val / 100) * audio.duration;
  }

  function setVol(v) {
    audio.volume = v;
    audio.muted  = (v == 0);
    updateVolIcon();
  }

  function toggleMute() {
    audio.muted = !audio.muted;
    volSlider.value = audio.muted ? 0 : (audio.volume || 1);
    updateVolIcon();
  }

  function updateVolIcon() {
    btnVol.innerHTML = (audio.muted || audio.volume === 0) ? '&#128263;' : '&#128266;';
  }

  audio.addEventListener('play',  () => { btnPlay.innerHTML = '&#9646;&#9646;'; statusTxt.textContent = 'Playing…'; });
  audio.addEventListener('pause', () => { btnPlay.innerHTML = '&#9654;'; if (!audio.ended) statusTxt.textContent = 'Paused'; });
  audio.addEventListener('ended', () => { btnPlay.innerHTML = '&#9654;'; statusTxt.textContent = 'Done — press ↺ to replay'; syncProgress(); });
  audio.addEventListener('timeupdate', syncProgress);
  audio.addEventListener('error', () => { statusTxt.textContent = '⚠ Audio error'; });

  audio.addEventListener('canplaythrough', () => {
    timeTxt.textContent = '0:00 / ' + fmt(audio.duration);
    statusTxt.textContent = 'Ready';
    audio.play().then(() => {
      statusTxt.textContent = 'Playing…';
    }).catch(() => {
      statusTxt.textContent = 'Press ▶ to play';
    });
  });
</script>

</body>
</html>
