<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Section 7 – Team Member Roles</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0d0d1f;
      color: #e0e0ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.6rem 1rem 2.5rem;
    }

    /* ── header ── */
    .header {
      width: 100%;
      max-width: 820px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.2rem;
    }
    .back-link {
      color: #ff69b4;
      text-decoration: none;
      font-size: 0.88rem;
      opacity: 0.85;
    }
    .back-link:hover { opacity: 1; text-decoration: underline; }
    .badge {
      font-size: 0.78rem;
      color: #8888bb;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* ── slide image ── */
    .slide-wrap {
      width: 100%;
      max-width: 820px;
      border: 2px solid #2a2a5a;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 1.2rem;
      box-shadow: 0 6px 32px rgba(0,0,0,0.55);
    }
    .slide-wrap img {
      width: 100%;
      display: block;
    }

    /* ── label ── */
    .section-label {
      font-size: 1.25rem;
      font-weight: 600;
      color: #ff69b4;
      margin-bottom: 0.3rem;
      text-align: center;
    }
    .cue-text {
      font-size: 0.88rem;
      color: #9999cc;
      margin-bottom: 1.2rem;
      text-align: center;
    }

    /* ── audio player card ── */
    .player-card {
      background: #12122a;
      border: 1px solid #2a2a5a;
      border-radius: 14px;
      padding: 1rem 1.4rem 1.1rem;
      width: 100%;
      max-width: 820px;
    }

    /* top row: play + time + volume */
    .controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.6rem;
    }

    /* play/pause button */
    .play-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: #ff69b4;
      color: #fff;
      font-size: 1.05rem;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.18s, transform 0.12s;
      box-shadow: 0 2px 10px rgba(255,105,180,0.45);
    }
    .play-btn:hover { background: #e05599; transform: scale(1.07); }

    /* time display */
    .time-display {
      font-size: 0.82rem;
      color: #aaaacc;
      min-width: 85px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* volume */
    .vol-wrap {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-left: auto;
    }
    .vol-icon {
      font-size: 1rem;
      cursor: pointer;
      user-select: none;
      color: #aaaacc;
    }
    .vol-slider {
      width: 72px;
      accent-color: #ff69b4;
      cursor: pointer;
    }

    /* replay */
    .replay-btn {
      background: none;
      border: none;
      color: #aaaacc;
      font-size: 1rem;
      cursor: pointer;
      padding: 0 2px;
      flex-shrink: 0;
    }
    .replay-btn:hover { color: #ff69b4; }

    /* progress bar row */
    .progress-wrap {
      position: relative;
      width: 100%;
      height: 18px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .progress-track {
      position: absolute;
      left: 0; right: 0;
      height: 4px;
      background: #2a2a5a;
      border-radius: 2px;
    }
    .progress-fill {
      height: 4px;
      background: #ff69b4;
      border-radius: 2px;
      width: 0%;
      transition: width 0.1s linear;
      pointer-events: none;
    }
    .progress-thumb {
      position: absolute;
      width: 13px;
      height: 13px;
      background: #ff69b4;
      border-radius: 50%;
      top: 50%; left: 0%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 4px rgba(255,105,180,0.6);
      pointer-events: none;
      transition: left 0.1s linear;
    }
    .progress-input {
      position: absolute;
      left: 0; right: 0;
      width: 100%;
      height: 18px;
      opacity: 0;
      cursor: pointer;
      margin: 0;
    }

    /* status text */
    .status-row {
      margin-top: 0.55rem;
      font-size: 0.78rem;
      color: #666699;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <a class="back-link" href="index.html">← All sections</a>
    <span class="badge">Section 7 of 7</span>
  </div>

  <!-- Actual presentation slide image -->
  <div class="slide-wrap">
    <img src="slide7.png" alt="Slide: Team Member Roles" />
  </div>

  <p class="section-label">🎙️ Team Member Roles</p>
  <p class="cue-text">Hear the team explain this section</p>

  <!-- Polished audio player -->
  <div class="player-card">
    <audio id="audio" preload="auto">
      <source src="7.ogg" type="audio/ogg">
    </audio>

    <div class="controls">
      <button class="play-btn" id="playBtn" title="Play / Pause" onclick="togglePlay()">▶</button>

      <span class="time-display" id="timeDisplay">0:00 / --:--</span>

      <button class="replay-btn" title="Replay from start" onclick="replayAudio()">↺</button>

      <div class="vol-wrap">
        <span class="vol-icon" id="volIcon" onclick="toggleMute()">🔊</span>
        <input class="vol-slider" type="range" id="volSlider"
               min="0" max="1" step="0.05" value="1"
               oninput="setVolume(this.value)">
      </div>
    </div>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-thumb" id="progressThumb"></div>
      <input class="progress-input" type="range" id="progressInput"
             min="0" max="100" step="0.1" value="0"
             oninput="seek(this.value)">
    </div>

    <p class="status-row" id="statusRow">Loading…</p>
  </div>

  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const timeDisplay = document.getElementById('timeDisplay');
    const progressFill = document.getElementById('progressFill');
    const progressThumb = document.getElementById('progressThumb');
    const progressInput = document.getElementById('progressInput');
    const statusRow = document.getElementById('statusRow');
    const volSlider = document.getElementById('volSlider');
    const volIcon = document.getElementById('volIcon');

    function fmt(s) {
      if (!isFinite(s)) return '--:--';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60).toString().padStart(2,'0');
      return `${m}:${sec}`;
    }

    function updateProgress() {
      if (!audio.duration) return;
      const pct = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = pct + '%';
      progressThumb.style.left = pct + '%';
      progressInput.value = pct;
      timeDisplay.textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
    }

    function togglePlay() {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    }

    function replayAudio() {
      audio.currentTime = 0;
      audio.play();
    }

    function seek(val) {
      if (audio.duration) {
        audio.currentTime = (val / 100) * audio.duration;
      }
    }

    function setVolume(val) {
      audio.volume = val;
      audio.muted = (val == 0);
      updateVolIcon();
    }

    function toggleMute() {
      audio.muted = !audio.muted;
      if (audio.muted) {
        volSlider.value = 0;
      } else {
        volSlider.value = audio.volume || 1;
      }
      updateVolIcon();
    }

    function updateVolIcon() {
      volIcon.textContent = audio.muted || audio.volume === 0 ? '🔇' : '🔊';
    }

    audio.addEventListener('play', () => {
      playBtn.textContent = '⏸';
      statusRow.textContent = '▶ Playing narration…';
    });
    audio.addEventListener('pause', () => {
      playBtn.textContent = '▶';
      if (audio.currentTime > 0 && !audio.ended) {
        statusRow.textContent = 'Paused';
      }
    });
    audio.addEventListener('ended', () => {
      playBtn.textContent = '▶';
      statusRow.textContent = '✔ Narration complete — press ↺ to replay';
      progressFill.style.width = '100%';
      progressThumb.style.left = '100%';
    });
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('error', () => {
      statusRow.textContent = '⚠ Could not load audio file';
    });
    audio.addEventListener('canplaythrough', () => {
      statusRow.textContent = 'Ready — press ▶ or wait for autoplay';
      timeDisplay.textContent = `0:00 / ${fmt(audio.duration)}`;
      audio.play().then(() => {
        statusRow.textContent = '▶ Playing narration…';
      }).catch(() => {
        statusRow.textContent = 'Autoplay blocked — press the pink ▶ to start';
      });
    });
  </script>

</body>
</html>
