<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Section 2 – Proposed Solution / Idea</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:      #ff4d8d;
      --pink-dk:   #c9306a;
      --pink-glow: rgba(255,77,141,0.4);
      --bg:        #0d0d1f;
      --ribbon-bg: #0a0a18;
      --border:    #1e1e3a;
      --text:      #e8e8ff;
      --muted:     #7777aa;
      --ribbon-h:  60px;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    /* ── sticky top bar ── */
    .topbar {
      position: sticky; top: 0; z-index: 30;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.45rem 1rem;
      background: rgba(10,10,24,0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .back-link { color: var(--pink); text-decoration: none; font-size: 0.8rem; opacity:.85; }
    .back-link:hover { opacity:1; text-decoration:underline; }
    .topbar-title { font-size: 0.85rem; font-weight:600; color: var(--pink); }
    .topbar-badge { font-size: 0.72rem; color: var(--muted); letter-spacing:1px; text-transform:uppercase; }

    /* ── slides container ── */
    .slides {
      max-width: 900px;
      margin: 0 auto;
      padding: 0.6rem 0 calc(var(--ribbon-h) + 12px);
    }

    /* each page wrapper — position:relative for overlay */
    .slide-wrap {
      position: relative;
      width: 100%;
      margin-bottom: 6px;
      line-height: 0;        /* remove gap under img */
    }
    .slide-wrap img {
      width: 100%;
      display: block;
      /* NO max-height — full content always visible */
    }

    /* ── play overlay on first slide ── */
    .play-overlay {
      position: absolute;
      right: 1.8%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      z-index: 10;
    }
    .click-text {
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--pink);
      text-align: right;
      line-height: 1.35;
      text-shadow: 0 1px 4px rgba(0,0,0,0.45);
    }
    .big-play-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: var(--pink);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-left: 2px;   /* optical centre for ▶ */
      box-shadow: 0 3px 16px var(--pink-glow);
      transition: background 0.15s, transform 0.12s, box-shadow 0.15s;
      flex-shrink: 0;
    }
    .big-play-btn:hover {
      background: var(--pink-dk);
      transform: scale(1.1);
      box-shadow: 0 4px 22px var(--pink-glow);
    }

    /* ═══════════════════════════════════
       BOTTOM RIBBON  (matches reference)
    ═══════════════════════════════════ */
    .ribbon {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--ribbon-h);
      background: var(--ribbon-bg);
      border-top: 1px solid rgba(255,77,141,0.18);
      display: flex;
      align-items: center;
      gap: 0;
      z-index: 100;
      padding: 0 0.8rem;
    }

    /* LEFT: menu + narration info */
    .rb-left {
      display: flex; align-items: center; gap: 0.6rem;
      min-width: 0; flex: 1;
    }
    .rb-menu {
      background: none; border: none;
      color: var(--muted); font-size: 1.15rem;
      cursor: pointer; flex-shrink: 0;
      transition: color 0.15s;
    }
    .rb-menu:hover { color: var(--pink); }
    .rb-narration {
      display: flex; flex-direction: column; min-width: 0;
    }
    .rb-narration-label {
      font-size: 0.78rem; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .rb-counter {
      font-size: 0.65rem; color: var(--muted);
    }

    /* CENTER: prev | play | next */
    .rb-center {
      display: flex; align-items: center; gap: 0.55rem;
      flex-shrink: 0; padding: 0 1rem;
    }
    .rb-skip {
      background: none; border: none;
      color: var(--muted); font-size: 1rem;
      cursor: pointer; padding: 0;
      transition: color 0.15s;
    }
    .rb-skip:hover { color: var(--text); }
    .rb-playpause {
      width: 40px; height: 40px;
      border-radius: 50%; border: none;
      background: var(--pink);
      color: #fff; font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      padding-left: 2px;
      box-shadow: 0 2px 12px var(--pink-glow);
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }
    .rb-playpause:hover { background: var(--pink-dk); transform: scale(1.08); }

    /* RIGHT: time | vol | slider | fullscreen */
    .rb-right {
      display: flex; align-items: center; gap: 0.5rem;
      flex-shrink: 0;
    }
    .rb-time {
      font-size: 0.75rem; color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .rb-vol-btn {
      background: none; border: none;
      color: var(--muted); font-size: 1rem;
      cursor: pointer; padding: 0;
      transition: color 0.15s;
    }
    .rb-vol-btn:hover { color: var(--pink); }
    .rb-vol-range {
      width: 70px;
      accent-color: var(--pink);
      cursor: pointer;
    }
    @media (max-width: 480px) {
      .rb-vol-range { display: none; }
      .rb-narration-label { font-size: 0.68rem; }
    }
    .rb-fullscreen {
      background: none; border: none;
      color: var(--muted); font-size: 1rem;
      cursor: pointer; padding: 0;
      transition: color 0.15s;
    }
    .rb-fullscreen:hover { color: var(--text); }

    /* progress bar (thin, sits above ribbon) */
    .rb-progress {
      position: fixed;
      bottom: var(--ribbon-h);
      left: 0; right: 0;
      height: 3px;
      background: var(--border);
      z-index: 101;
      cursor: pointer;
    }
    .rb-prog-fill {
      height: 100%;
      background: var(--pink);
      width: 0%;
      transition: width 0.1s linear;
    }
    .rb-prog-input {
      position: absolute;
      inset: -6px 0;
      width: 100%; height: 16px;
      opacity: 0; cursor: pointer; margin: 0;
    }
  </style>
</head>
<body>

<!-- sticky top bar -->
<div class="topbar">
  <a class="back-link" href="index.html">&larr; All sections</a>
  <span class="topbar-title">Proposed Solution / Idea</span>
  <span class="topbar-badge">Section 2&thinsp;/&thinsp;7</span>
</div>

<!-- hidden audio -->
<audio id="audio" preload="auto">
  <source src="2.ogg" type="audio/ogg">
</audio>

<!-- all PDF pages — full width, scrollable -->
<div class="slides">
  <div class="slide-wrap">
    <img src="slide_p5.png" alt="Page 6" loading="lazy">

      <div class="play-overlay" style="top:6.53%"
           onclick="startPlay()" title="Click to play narration">
        <span class="click-text">Click to hear<br>the team explain&nbsp;&#8594;</span>
        <button class="big-play-btn">&#9654;</button>
      </div>  </div>
  <div class="slide-wrap">
    <img src="slide_p6.png" alt="Page 7" loading="lazy">
  </div>
</div>

<!-- thin progress bar above ribbon -->
<div class="rb-progress">
  <div class="rb-prog-fill" id="rbFill"></div>
  <input type="range" class="rb-prog-input" id="rbProgInput"
         min="0" max="100" step="0.05" value="0"
         oninput="seek(this.value)">
</div>

<!-- bottom ribbon -->
<div class="ribbon">

  <!-- LEFT -->
  <div class="rb-left">
    <button class="rb-menu" title="All sections" onclick="window.location='index.html'">&#9776;</button>
    <div class="rb-narration">
      <span class="rb-narration-label">Narration: Proposed Solution / Idea</span>
      <span class="rb-counter">2&nbsp;/&nbsp;7</span>
    </div>
  </div>

  <!-- CENTER -->
  <div class="rb-center">
    <button class="rb-skip" title="Previous section"
            onclick="window.location='section1.html'"
            >&#9198;</button>
    <button class="rb-playpause" id="rbPlay" title="Play / Pause"
            onclick="togglePlay()">&#9654;</button>
    <button class="rb-skip" title="Next section"
            onclick="window.location='section3.html'"
            >&#9197;</button>
  </div>

  <!-- RIGHT -->
  <div class="rb-right">
    <span class="rb-time" id="rbTime">0:00&nbsp;/&nbsp;--:--</span>
    <button class="rb-vol-btn" id="rbVolBtn" title="Mute" onclick="toggleMute()">&#128266;</button>
    <input class="rb-vol-range" type="range" id="rbVolRange"
           min="0" max="1" step="0.05" value="1"
           oninput="setVol(this.value)">
    <button class="rb-fullscreen" title="Fullscreen" onclick="toggleFs()">&#9974;</button>
  </div>

</div>

<script>
  const audio      = document.getElementById('audio');
  const rbPlay     = document.getElementById('rbPlay');
  const rbFill     = document.getElementById('rbFill');
  const rbProgInput= document.getElementById('rbProgInput');
  const rbTime     = document.getElementById('rbTime');
  const rbVolBtn   = document.getElementById('rbVolBtn');
  const rbVolRange = document.getElementById('rbVolRange');

  function fmt(s) {
    if (!isFinite(s)) return '--:--';
    return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
  }

  function sync() {
    if (!audio.duration) return;
    const pct = audio.currentTime / audio.duration * 100;
    rbFill.style.width = pct + '%';
    rbProgInput.value  = pct;
    rbTime.textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
  }

  function startPlay() {
    audio.play();
  }

  function togglePlay() {
    audio.paused ? audio.play() : audio.pause();
  }

  function seek(val) {
    if (audio.duration) audio.currentTime = val / 100 * audio.duration;
  }

  function setVol(v) {
    audio.volume = v;
    audio.muted  = v == 0;
    updateVolIcon();
  }

  function toggleMute() {
    audio.muted  = !audio.muted;
    rbVolRange.value = audio.muted ? 0 : (audio.volume || 1);
    updateVolIcon();
  }

  function updateVolIcon() {
    rbVolBtn.innerHTML = (audio.muted || audio.volume === 0) ? '&#128263;' : '&#128266;';
  }

  function toggleFs() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }

  audio.addEventListener('play',   () => { rbPlay.innerHTML = '&#9646;&#9646;'; });
  audio.addEventListener('pause',  () => { rbPlay.innerHTML = '&#9654;'; });
  audio.addEventListener('ended',  () => { rbPlay.innerHTML = '&#9654;'; rbFill.style.width='100%'; });
  audio.addEventListener('timeupdate', sync);
  audio.addEventListener('canplaythrough', () => {
    rbTime.textContent = '0:00 / ' + fmt(audio.duration);
    audio.play().catch(() => {});
  });
</script>

</body>
</html>
