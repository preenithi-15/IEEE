<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Section 4 &ndash; Feasibility & Implementation Plan</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:       #ff4d8d;
      --pink-dark:  #c9306a;
      --pink-glow:  rgba(255, 77, 141, 0.35);
      --bg:         #0d0d1f;
      --surface:    #0f0f24;
      --border:     #1e1e3a;
      --text:       #e0e0ff;
      --muted:      #7777aa;
      --bar-bg:     rgba(10, 10, 28, 0.97);
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100%;
    }

    /* ── sticky top nav ── */
    .topbar {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.55rem 1.2rem;
      background: rgba(10,10,28,0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .back-link {
      color: var(--pink); text-decoration: none; font-size: 0.82rem;
      opacity: 0.85; transition: opacity 0.15s;
    }
    .back-link:hover { opacity: 1; text-decoration: underline; }
    .badge {
      font-size: 0.72rem; color: var(--muted);
      letter-spacing: 1.5px; text-transform: uppercase;
    }
    .sec-title {
      font-size: 0.88rem; font-weight: 600; color: var(--pink);
      text-align: center; max-width: 220px;
    }

    /* ── content area ── */
    .content {
      max-width: 900px;
      margin: 0 auto;
      padding: 1.2rem 1rem 110px; /* bottom padding for floating bar */
    }

    /* ── pill button — "hear us explain" ── */
    .hear-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.5rem 1.05rem;
      background: rgba(255, 77, 141, 0.08);
      border: 1.5px solid rgba(255, 77, 141, 0.4);
      border-radius: 999px;
      color: var(--pink);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 1.1rem;
      user-select: none;
    }
    .hear-pill:hover {
      background: rgba(255, 77, 141, 0.18);
      border-color: var(--pink);
      box-shadow: 0 0 12px var(--pink-glow);
    }
    .hear-pill:active { transform: scale(0.97); }
    .hear-pill .pill-icon { font-size: 1rem; }

    /* ── slide frames — FULL SIZE, nothing cut ── */
    .slide-frame {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      border: 1.5px solid var(--border);
      box-shadow: 0 4px 28px rgba(0,0,0,0.6);
      margin-bottom: 1.1rem;
    }
    .slide-frame img {
      width: 100%;
      display: block;
      /* NO max-height — show everything */
    }

    /* ═══════════════════════════════════════════
       FLOATING AUDIO BAR (bottom-center)
       Reference: dark card, × | info | controls
    ═══════════════════════════════════════════ */
    .float-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(760px, 96vw);
      background: var(--bar-bg);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,77,141,0.2);
      border-bottom: none;
      border-radius: 14px 14px 0 0;
      padding: 0.7rem 1rem 0.65rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      z-index: 100;
      box-shadow: 0 -4px 28px rgba(0,0,0,0.55);
      transition: opacity 0.25s;
    }
    .float-bar.hidden { opacity: 0; pointer-events: none; }

    /* close button */
    .fb-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
      line-height: 1;
      flex-shrink: 0;
      padding: 2px 4px;
      transition: color 0.15s;
    }
    .fb-close:hover { color: var(--pink); }

    /* separator */
    .fb-sep {
      width: 1px;
      height: 32px;
      background: var(--border);
      flex-shrink: 0;
    }

    /* info block */
    .fb-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex-shrink: 1;
    }
    .fb-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .fb-sub {
      font-size: 0.68rem;
      color: var(--muted);
      white-space: nowrap;
    }

    /* spacer */
    .fb-space { flex: 1; }

    /* controls group */
    .fb-controls {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-shrink: 0;
    }

    /* play/pause circle */
    .fb-play {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: var(--pink);
      color: #fff;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 2px 10px var(--pink-glow);
    }
    .fb-play:hover { background: var(--pink-dark); transform: scale(1.08); }

    /* time */
    .fb-time {
      font-size: 0.75rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      min-width: 72px;
    }

    /* progress bar */
    .fb-prog {
      position: relative;
      width: 100px;
      height: 18px;
      display: flex;
      align-items: center;
      cursor: pointer;
      flex-shrink: 1;
    }
    @media (max-width: 500px) { .fb-prog { width: 50px; } }
    .fb-track {
      position: absolute;
      inset: 0; margin: auto;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
    }
    .fb-fill {
      position: absolute;
      left: 0; top: 50%; transform: translateY(-50%);
      height: 3px;
      background: var(--pink);
      border-radius: 2px;
      width: 0%;
      pointer-events: none;
    }
    .fb-thumb {
      position: absolute;
      top: 50%; left: 0%;
      transform: translate(-50%, -50%);
      width: 10px; height: 10px;
      background: var(--pink);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--pink-glow);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .fb-prog:hover .fb-thumb { opacity: 1; }
    .fb-prog-input {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      opacity: 0; cursor: pointer; margin: 0;
    }

    /* volume */
    .fb-vol {
      background: none; border: none;
      color: var(--muted); font-size: 1rem;
      cursor: pointer; padding: 0;
      transition: color 0.15s; flex-shrink: 0;
    }
    .fb-vol:hover { color: var(--pink); }
  </style>
</head>
<body>

<!-- sticky top nav -->
<div class="topbar">
  <a class="back-link" href="index.html">&larr; All sections</a>
  <p class="sec-title">Feasibility & Implementation Plan</p>
  <span class="badge">Section 4&thinsp;/&thinsp;7</span>
</div>

<!-- main content -->
<div class="content">

  <!-- pill button — at the top before slides -->
  <button class="hear-pill" id="hearPill" onclick="pillPlay()">
    <span class="pill-icon">&#128266;</span>
    Hear the team explain this section
  </button>

  <!-- all slides — full size, nothing cut -->
  <div class="slide-frame"><img src="slide_p7.png" alt="Slide page 8" loading="lazy"></div>
  <div class="slide-frame"><img src="slide_p8.png" alt="Slide page 9" loading="lazy"></div>

</div>

<!-- hidden audio -->
<audio id="audio" preload="auto">
  <source src="4.ogg" type="audio/ogg">
</audio>

<!-- floating audio bar -->
<div class="float-bar" id="floatBar">

  <button class="fb-close" title="Dismiss" onclick="dismissBar()">&#215;</button>
  <div class="fb-sep"></div>

  <div class="fb-info">
    <span class="fb-title">Section 4 &mdash; Feasibility & Implementation Plan</span>
    <span class="fb-sub" id="fbSub">Tap &ldquo;Hear the team&rdquo; or press play</span>
  </div>

  <div class="fb-space"></div>

  <div class="fb-controls">

    <!-- play/pause -->
    <button class="fb-play" id="fbPlay" title="Play / Pause" onclick="togglePlay()">&#9654;</button>

    <!-- time -->
    <span class="fb-time" id="fbTime">0:00&nbsp;/&nbsp;--:--</span>

    <!-- progress -->
    <div class="fb-prog">
      <div class="fb-track"></div>
      <div class="fb-fill"  id="fbFill"></div>
      <div class="fb-thumb" id="fbThumb"></div>
      <input class="fb-prog-input" type="range"
             id="fbProg" min="0" max="100" step="0.05" value="0"
             oninput="seek(this.value)">
    </div>

    <!-- volume -->
    <button class="fb-vol" id="fbVol" title="Mute / Unmute" onclick="toggleMute()">&#128266;</button>

  </div>
</div>

<script>
  const audio   = document.getElementById('audio');
  const fbPlay  = document.getElementById('fbPlay');
  const fbFill  = document.getElementById('fbFill');
  const fbThumb = document.getElementById('fbThumb');
  const fbProg  = document.getElementById('fbProg');
  const fbTime  = document.getElementById('fbTime');
  const fbSub   = document.getElementById('fbSub');
  const fbVol   = document.getElementById('fbVol');
  const floatBar= document.getElementById('floatBar');
  const hearPill= document.getElementById('hearPill');
  let barDismissed = false;

  function fmt(s) {
    if (!isFinite(s)) return '--:--';
    return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
  }

  function sync() {
    if (!audio.duration) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    fbFill.style.width  = pct + '%';
    fbThumb.style.left  = pct + '%';
    fbProg.value        = pct;
    fbTime.textContent  = fmt(audio.currentTime) + '\u00a0/\u00a0' + fmt(audio.duration);
  }

  function togglePlay() {
    audio.paused ? audio.play() : audio.pause();
  }

  function pillPlay() {
    // Show bar if dismissed, then play
    barDismissed = false;
    floatBar.classList.remove('hidden');
    audio.paused ? audio.play() : audio.pause();
  }

  function seek(val) {
    if (audio.duration) audio.currentTime = (val/100) * audio.duration;
  }

  function toggleMute() {
    audio.muted = !audio.muted;
    fbVol.innerHTML = audio.muted ? '&#128263;' : '&#128266;';
  }

  function dismissBar() {
    barDismissed = true;
    floatBar.classList.add('hidden');
    audio.pause();
  }

  // Audio events
  audio.addEventListener('play', () => {
    fbPlay.innerHTML = '&#9646;&#9646;';
    fbSub.textContent = 'Playing\u2026';
    hearPill.innerHTML = '<span class="pill-icon">&#128266;</span> Pause narration';
    if (!barDismissed) floatBar.classList.remove('hidden');
  });
  audio.addEventListener('pause', () => {
    fbPlay.innerHTML = '&#9654;';
    hearPill.innerHTML = '<span class="pill-icon">&#128266;</span> Hear the team explain this section';
    if (!audio.ended) fbSub.textContent = 'Paused \u2014 press \u25b6 to resume';
  });
  audio.addEventListener('ended', () => {
    fbPlay.innerHTML = '&#9654;';
    fbSub.textContent = 'Done \u2014 press \u25b6 to replay';
    hearPill.innerHTML = '<span class="pill-icon">&#128266;</span> Hear the team explain this section';
  });
  audio.addEventListener('timeupdate', sync);
  audio.addEventListener('error', () => { fbSub.textContent = '\u26a0 Audio unavailable'; });
  audio.addEventListener('canplaythrough', () => {
    fbTime.textContent = '0:00\u00a0/\u00a0' + fmt(audio.duration);
    audio.play().catch(() => {
      fbSub.textContent = 'Press \u25b6 or the pill button to play';
    });
  });
</script>

</body>
</html>
